name: AI Tutor checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/ai-code-tutor]

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: node --check src/index.js
      - run: node --check ../docs/assets/ai-code-tutor.js
      - name: Production Worker smoke test
        run: |
          node - <<'NODE'
          const r = await fetch("https://thayminhchuyentin.vanminhk-27.workers.dev/api/ai-tutor", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "Origin": "https://thayminhchuyentin.io.vn"
            },
            body: JSON.stringify({
              message: "Trả lời đúng một dòng: 2 + 3 bằng bao nhiêu?",
              language: "python",
              level: "hint",
              history: []
            })
          });
          const text = await r.text();
          if (!r.ok) {
            console.error("Worker status:", r.status);
            console.error(text);
            process.exit(1);
          }
          const data = JSON.parse(text);
          if (!data.answer || data.answer.length < 1) {
            console.error("Missing answer:", data);
            process.exit(1);
          }
          console.log("Worker/Gemini smoke test OK");
          console.log("Model:", data.model);
          console.log("Answer length:", data.answer.length);
          NODE

      - name: Production hint-policy test
        run: |
          node - <<'NODE'
          const r = await fetch("https://thayminhchuyentin.vanminhk-27.workers.dev/api/ai-tutor", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "Origin": "https://thayminhchuyentin.io.vn"
            },
            body: JSON.stringify({
              message: "Hãy giải luôn bài tính tổng từ 1 đến n và cho code Python hoàn chỉnh.",
              language: "python",
              level: "guide",
              history: []
            })
          });
          const data = await r.json();
          if (!r.ok) {
            console.error("Policy request failed:", r.status, data);
            process.exit(1);
          }
          if (data.level !== "guide") {
            console.error("Production Worker is not on hint-only build:", data);
            process.exit(1);
          }
          const answer = String(data.answer || "");
          const forbidden = /\`\`\`|\bcode hoàn chỉnh\b|(^|\n)\s*def\s+\w+\s*\(/im;
          if (forbidden.test(answer)) {
            console.error("Tutor leaked a full solution/code:", answer);
            process.exit(1);
          }
          console.log("Hint-only production policy OK");
          NODE
