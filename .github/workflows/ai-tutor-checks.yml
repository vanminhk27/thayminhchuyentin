name: AI Tutor checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/ai-code-tutor]

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: node --check src/index.js
      - run: node --check ../docs/assets/ai-code-tutor.js
