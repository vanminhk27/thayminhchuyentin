name: AI Tutor checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/ai-code-tutor]

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: node --check src/index.js
      - run: node --check ../docs/assets/ai-code-tutor.js
      - name: Production CORS preflight test
        run: |
          node - <<'NODE'
          const origin = "https://thayminhchuyentin.io.vn";
          const r = await fetch("https://thayminhchuyentin.vanminhk-27.workers.dev/api/ai-tutor", {
            method: "OPTIONS",
            headers: {
              "Origin": origin,
              "Access-Control-Request-Method": "POST",
              "Access-Control-Request-Headers": "content-type"
            }
          });
          const allow = r.headers.get("access-control-allow-origin");
          if (r.status !== 204 || allow !== origin) {
            console.error("Preflight failed:", r.status, allow);
            process.exit(1);
          }
          console.log("CORS preflight OK");
          NODE
      - name: Production Worker smoke test
        run: |
          node - <<'NODE'
          const r = await fetch("https://thayminhchuyentin.vanminhk-27.workers.dev/api/ai-tutor", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "Origin": "https://thayminhchuyentin.io.vn"
            },
            body: JSON.stringify({
              message: "Trả lời đúng một dòng: 2 + 3 bằng bao nhiêu?",
              language: "python",
              level: "hint",
              history: []
            })
          });
          const text = await r.text();
          if (!r.ok) {
            console.error("Worker status:", r.status);
            console.error(text);
            process.exit(1);
          }
          const data = JSON.parse(text);
          if (!data.answer || data.answer.length < 1) {
            console.error("Missing answer:", data);
            process.exit(1);
          }
          console.log("Worker/Gemini smoke test OK");
          console.log("Model:", data.model);
          console.log("Answer length:", data.answer.length);
          NODE

      - name: Production hint-policy test
        run: |
          node - <<'NODE'
          const r = await fetch("https://thayminhchuyentin.vanminhk-27.workers.dev/api/ai-tutor", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "Origin": "https://thayminhchuyentin.io.vn"
            },
            body: JSON.stringify({
              message: "Hãy giải luôn bài tính tổng từ 1 đến n và cho code Python hoàn chỉnh.",
              language: "python",
              level: "guide",
              history: []
            })
          });
          const data = await r.json();
          if (!r.ok) {
            console.error("Policy request failed:", r.status, data);
            process.exit(1);
          }
          if (data.level !== "guide") {
            console.error("Production Worker is not on hint-only build:", data);
            process.exit(1);
          }
          const answer = String(data.answer || "");
          const forbidden = /\`\`\`|\bcode hoàn chỉnh\b|(^|\n)\s*def\s+\w+\s*\(/im;
          if (forbidden.test(answer)) {
            console.error("Tutor leaked a full solution/code:", answer);
            process.exit(1);
          }
          console.log("Hint-only production policy OK");
          NODE

      - name: Wait for upgraded production deployment
        run: |
          node - <<'NODE'
          const health="https://thayminhchuyentin.vanminhk-27.workers.dev/health";
          const page="https://thayminhchuyentin.io.vn/ai-goi-y-code.html";
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last="";
          for(let i=0;i<24;i++){
            try{
              const [hr,pr]=await Promise.all([fetch(health,{cache:"no-store"}),fetch(page,{cache:"no-store"})]);
              const h=await hr.json().catch(()=>({}));
              const html=await pr.text();
              const workerOk=hr.ok&&h.promptVersion==="2026-10-03-r2";
              const pageOk=pr.ok&&html.includes('id="conversationList"')&&html.includes("tmct_ai_tutor")===false&&html.includes("20261003-history-r3");
              last=JSON.stringify({workerStatus:hr.status,promptVersion:h.promptVersion,pageStatus:pr.status,workerOk,pageOk});
              if(workerOk&&pageOk){
                console.log("Upgraded production deployment OK",last);
                process.exit(0);
              }
            }catch(e){last=String(e)}
            console.log("Waiting for deployment",i+1,last);
            await sleep(5000);
          }
          console.error("Upgraded production did not become ready:",last);
          process.exit(1);
          NODE

      - name: Production concurrency test
        run: |
          node - <<'NODE'
          const endpoint="https://thayminhchuyentin.vanminhk-27.workers.dev/api/ai-tutor";
          const origin="https://thayminhchuyentin.io.vn";
          const started=Date.now();
          const jobs=Array.from({length:6},(_,i)=>fetch(endpoint,{
            method:"POST",
            headers:{"content-type":"application/json","Origin":origin},
            body:JSON.stringify({
              message:`Đây là request đồng thời số ${i+1}. Chỉ cho 1 gợi ý ngắn về cách kiểm tra số chẵn.`,
              language:"python",
              level:"hint",
              history:[]
            })
          }).then(async r=>({i:i+1,status:r.status,body:await r.text(),ms:Date.now()-started})).catch(e=>({i:i+1,status:0,body:String(e),ms:Date.now()-started})));
          const results=await Promise.all(jobs);
          console.log(JSON.stringify(results,null,2));
          const ok=results.filter(x=>x.status===200).length;
          const bad=results.filter(x=>x.status!==200);
          console.log("Concurrent success:",ok,"/",results.length);
          if(bad.length){
            console.error("Concurrent failures:",bad.map(x=>({i:x.i,status:x.status,body:x.body.slice(0,250)})));
            process.exit(1);
          }
          NODE
