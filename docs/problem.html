<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bài tập | Thầy Minh Chuyên Tin</title>
  <style>
    :root{--navy:#062b59;--blue:#0967c9;--orange:#ff8a00;--soft:#f4f7fa;--line:#dbe7f4;--muted:#62738a}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;color:#14233a;background:var(--soft)}a{text-decoration:none;color:inherit}button,select,textarea{font:inherit}.wrap{width:min(1160px,calc(100% - 30px));margin:auto}.top{background:#fff;border-bottom:1px solid var(--line)}.nav{height:70px;display:flex;align-items:center;gap:14px}.brand{margin-right:auto;color:var(--navy);font-weight:900}.nav a:last-child{color:var(--blue);font-size:13px;font-weight:800}.grid{display:grid;grid-template-columns:1fr .9fr;gap:18px;padding:34px 0 52px}.panel{padding:24px;background:#fff;border:1px solid var(--line);border-radius:14px}.panel h1{margin-top:0;color:var(--navy)}.meta{display:flex;flex-wrap:wrap;gap:10px}.meta span{padding:6px 9px;color:#38516d;font-size:12px;background:#edf5ff;border-radius:999px}.sample{padding:15px;color:#dceaff;font-family:Consolas,monospace;white-space:pre-wrap;background:#081b38;border-radius:8px}.editor{overflow:hidden;margin-top:14px;background:#07182f;border-radius:10px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 13px;color:#dceaff;background:#102849}.toolbar select{padding:6px 8px;color:#dceaff;background:#17385f;border:1px solid #31577f;border-radius:6px}.saved{font-size:11px;color:#8fb0d4}.editor textarea{width:100%;min-height:360px;padding:17px;color:#e4ecf8;font:14px/1.55 Consolas,monospace;resize:vertical;background:#07182f;border:0;outline:0}.actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:12px}.btn{padding:11px 15px;color:#fff;font-weight:800;cursor:pointer;background:var(--blue);border:0;border-radius:7px}.btn.secondary{color:var(--navy);background:#edf5ff}.btn.submit{background:var(--orange)}.msg{display:none;margin-top:12px;padding:12px;color:#72550c;background:#fff8e8;border-radius:8px}.navProblems{display:flex;justify-content:space-between;margin-top:18px}.navProblems a{color:var(--blue);font-size:13px;font-weight:800}.problemText{color:#35465e}.problemText h3{margin-top:24px;color:var(--navy)}
    @media(max-width:850px){.grid{grid-template-columns:1fr}.panel{padding:19px}.editor textarea{min-height:300px}.nav{height:62px}.nav a:last-child{display:none}}
  </style>
</head>
<body>
  <header class="top"><div class="wrap nav"><a class="brand" href="problems.html">← Kho bài tập</a><a href="index.html#contact">Đăng ký học cùng Thầy Minh</a></div></header>
  <main class="wrap grid">
    <section class="panel">
      <h1 id="title">Bài tập</h1>
      <div class="meta"><span id="idLabel"></span><span>Time Limit: 1s</span><span>Memory: 256 MB</span><span id="difficulty"></span></div>
      <div class="problemText"><h3>Mô tả</h3><p id="description"></p><h3>Input</h3><p id="inputText"></p><h3>Output</h3><p id="outputText"></p><h3>Ví dụ</h3><div class="sample" id="sample"></div></div>
      <div class="navProblems"><a id="prev" href="#">← Bài trước</a><a id="next" href="#">Bài tiếp →</a></div>
    </section>
    <section class="panel">
      <h2 style="margin-top:0;color:var(--navy)">Code Editor</h2>
      <div class="editor"><div class="toolbar"><select id="language" aria-label="Ngôn ngữ lập trình"><option value="cpp">C++17</option><option value="python">Python 3</option></select><span class="saved" id="saved">Chưa có thay đổi</span></div><textarea id="code" spellcheck="false" aria-label="Trình soạn thảo code"></textarea></div>
      <div class="actions"><button class="btn secondary" id="reset">Khôi phục mẫu</button><button class="btn secondary" id="copy">Sao chép</button><button class="btn submit" id="submit">Nộp bài</button></div>
      <div class="msg" id="msg" aria-live="polite">Code đã được lưu trên trình duyệt. Tính năng chấm tự động sẽ hoạt động sau khi kết nối máy chủ Judge.</div>
    </section>
  </main>
  <script>
    const problems={
      "001":{title:"Tổng hai số",level:"Dễ",description:"Cho hai số nguyên a và b. Hãy tính tổng của hai số đó.",input:"Một dòng gồm hai số nguyên a và b.",output:"In ra giá trị a + b.",sample:"Input\n2 3\n\nOutput\n5",cpp:"#include <iostream>\nusing namespace std;\n\nint main() {\n    long long a, b;\n    cin >> a >> b;\n    cout << a + b;\n    return 0;\n}",python:"a, b = map(int, input().split())\nprint(a + b)"},
      "002":{title:"Kiểm tra số nguyên tố",level:"Dễ",description:"Cho số nguyên dương n. Hãy kiểm tra n có phải số nguyên tố hay không.",input:"Một số nguyên dương n (2 ≤ n ≤ 10^9).",output:"In YES nếu n là số nguyên tố, ngược lại in NO.",sample:"Input\n17\n\nOutput\nYES",cpp:"#include <iostream>\nusing namespace std;\n\nint main() {\n    long long n;\n    cin >> n;\n    bool prime = n >= 2;\n    for (long long i = 2; i * i <= n; ++i)\n        if (n % i == 0) prime = false;\n    cout << (prime ? \"YES\" : \"NO\");\n}",python:"n = int(input())\nprime = n >= 2\ni = 2\nwhile i * i <= n:\n    if n % i == 0:\n        prime = False\n        break\n    i += 1\nprint(\"YES\" if prime else \"NO\")"},
      "003":{title:"Tổng lớn nhất của dãy con",level:"Trung bình",description:"Cho dãy n số nguyên. Tìm tổng lớn nhất của một dãy con liên tiếp không rỗng.",input:"Dòng đầu là n. Dòng thứ hai gồm n số nguyên.",output:"In ra tổng lớn nhất tìm được.",sample:"Input\n5\n-2 3 -1 5 -4\n\nOutput\n7",cpp:"#include <iostream>\n#include <algorithm>\nusing namespace std;\n\nint main() {\n    int n; cin >> n;\n    long long x, best, current;\n    cin >> x; best = current = x;\n    for (int i = 1; i < n; ++i) {\n        cin >> x;\n        current = max(x, current + x);\n        best = max(best, current);\n    }\n    cout << best;\n}",python:"n = int(input())\na = list(map(int, input().split()))\nbest = current = a[0]\nfor x in a[1:]:\n    current = max(x, current + x)\n    best = max(best, current)\nprint(best)"},
      "004":{title:"Đường đi ngắn nhất",level:"Khó",description:"Cho đồ thị vô hướng có trọng số dương. Tìm khoảng cách ngắn nhất từ đỉnh 1 đến đỉnh n.",input:"Dòng đầu gồm n, m. m dòng tiếp theo gồm u, v, w mô tả một cạnh.",output:"In khoảng cách ngắn nhất, hoặc -1 nếu không có đường đi.",sample:"Input\n4 4\n1 2 3\n2 4 5\n1 3 2\n3 4 4\n\nOutput\n6",cpp:"#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    // Hãy cài đặt thuật toán Dijkstra tại đây.\n    return 0;\n}",python:"import heapq\n\n# Hãy cài đặt thuật toán Dijkstra tại đây.\n"}
    };
    const ids=Object.keys(problems),params=new URLSearchParams(location.search),id=problems[params.get("id")]?params.get("id"):"001",p=problems[id];
    document.title=p.title+" | Thầy Minh Chuyên Tin";document.getElementById("title").textContent=p.title;document.getElementById("idLabel").textContent="#"+id;document.getElementById("difficulty").textContent="Độ khó: "+p.level;document.getElementById("description").textContent=p.description;document.getElementById("inputText").textContent=p.input;document.getElementById("outputText").textContent=p.output;document.getElementById("sample").textContent=p.sample;
    const index=ids.indexOf(id),prev=document.getElementById("prev"),next=document.getElementById("next");if(index===0)prev.style.visibility="hidden";else prev.href="?id="+ids[index-1];if(index===ids.length-1)next.style.visibility="hidden";else next.href="?id="+ids[index+1];
    const language=document.getElementById("language"),code=document.getElementById("code"),saved=document.getElementById("saved"),msg=document.getElementById("msg");function storageKey(){return"thayminh-code-"+id+"-"+language.value}function loadCode(){code.value=localStorage.getItem(storageKey())||p[language.value];saved.textContent=localStorage.getItem(storageKey())?"Đã khôi phục code đã lưu":"Đang dùng code mẫu";msg.style.display="none"}language.addEventListener("change",loadCode);let timer;code.addEventListener("input",()=>{saved.textContent="Đang lưu...";clearTimeout(timer);timer=setTimeout(()=>{localStorage.setItem(storageKey(),code.value);saved.textContent="Đã lưu tự động"},350)});document.getElementById("reset").addEventListener("click",()=>{if(confirm("Khôi phục code mẫu của bài này?")){localStorage.removeItem(storageKey());loadCode()}});document.getElementById("copy").addEventListener("click",async()=>{await navigator.clipboard.writeText(code.value);saved.textContent="Đã sao chép code"});document.getElementById("submit").addEventListener("click",()=>{localStorage.setItem(storageKey(),code.value);saved.textContent="Đã lưu";msg.style.display="block"});loadCode();
  </script>
</body>
</html>
